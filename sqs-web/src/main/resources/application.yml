server:
  port: 8080

spring:
  application:
    name: smart-query-system
  profiles:
    active: dev
  # ---------------- 数据源（SQLite 内嵌本地文件库） ----------------
  datasource:
    driver-class-name: org.sqlite.JDBC
    # journal_mode=WAL 读写并行；busy_timeout 规避 SQLITE_BUSY
    url: jdbc:sqlite:${DB_FILE:./data/smart-query.db}?journal_mode=WAL&busy_timeout=5000
    hikari:
      # SQLite 单写者，收紧连接池
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  # ---------------- 启动自动建表（幂等 DDL + 种子数据） ----------------
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-sqlite.sql
  # ---------------- 文件上传 ----------------
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
# ---------------- 业务配置 ----------------
sqs:
  security:
    jwt:
      # 生产环境务必通过环境变量 SQS_JWT_SECRET 覆盖（长度需 >= 32 字节）
      secret: ${SQS_JWT_SECRET:smart-query-system-dev-jwt-secret-please-replace-me}
      expiration-hours: 12
  ai:
    # DashScope API Key（环境变量 AI_DASHSCOPE_API_KEY，必填）
    api-key: ${AI_DASHSCOPE_API_KEY:}
    default-model: qwen-plus
    temperature: 0.7
    history-limit: 20
    system-prompt: |
      你是 SmartQuery 智能助手，一个专业、简洁、友好的中文 AI 助手。
      回答请使用 Markdown 排版：长内容分条陈述，代码放入带语言标注的代码块。
      不确定时应明确说明不确定，不要编造事实。
    models:
      - code: qwen-plus
        label: 通义千问 Plus
        multimodal: false
      - code: qwen-max
        label: 通义千问 Max
        multimodal: false
      - code: qwen-turbo
        label: 通义千问 Turbo
        multimodal: false
      - code: qwen-vl-max
        label: 通义千问 VL Max（图片理解）
        multimodal: true
    rag:
      enabled: true
      top-k: 4
      chunk-size: 600
      overlap: 80
      scan-limit: 2000
    web-search:
      enabled: true
    embedding:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: text-embedding-v4
      dimensions: 1024
      batch-size: 10
  upload:
    # 上传文件存储目录（/uploads/** 映射到此）
    dir: ${SQS_UPLOAD_DIR:./data/uploads}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.sqs: info
    io.agentscope: warn
